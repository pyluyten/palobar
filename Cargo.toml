[package]
name = "palobar"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
gtk = { package = "gtk4", version = "=0.10.3" }
gtk4-layer-shell = "=0.7.1"
sourceview5 = "=0.10.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
