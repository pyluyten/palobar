[package]
name = "palobar-run-command-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
default-run = "palobar-run-command-rs"

[[bin]]
name = "palobar-run-command-rs"
path = "src/main.rs"

[[bin]]
name = "palobar-bar-rs"
path = "src/bin/bar.rs"

[dependencies]
gtk = { package = "gtk4", version = "=0.10.3" }
gtk4-layer-shell = "=0.7.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
